<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码登录</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#1a1a2e}
    .card{background:#fff;width:400px;max-width:calc(100% - 32px);border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.06);padding:36px;text-align:center}
    @media(max-width:480px){.card{padding:24px 16px}.title{font-size:18px}.qr-wrap{width:180px;height:180px}.btn{padding:9px 16px;font-size:13px}}
    .title{font-size:20px;font-weight:700;margin-bottom:6px}
    .sub{font-size:14px;color:#909399;margin-bottom:24px}
    .qr-wrap{width:220px;height:220px;margin:0 auto 20px;border:1px solid #e8e8e8;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}
    .qr-wrap img{width:100%;height:100%;object-fit:contain}
    .status{font-size:14px;margin-bottom:16px;min-height:22px;font-weight:500}
    .s-pending{color:#909399}.s-scanned{color:#409eff}.s-ok{color:#52c41a}.s-err{color:#ff4d4f}
    .countdown{font-size:12px;color:#c0c4cc;margin-bottom:20px;min-height:16px}
    .acc-box{background:#f6ffed;border:1px solid #c2e7b0;border-radius:8px;padding:14px;margin-bottom:20px;text-align:left;font-size:13px;display:none}
    .acc-box b{color:#52c41a}
    .actions{display:flex;gap:10px;justify-content:center}
    .btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
    .btn-primary{background:#1a1a2e;color:#fff}.btn-primary:hover{background:#2d2d44}
    .btn-ghost{background:#f5f5f5;color:#606266}.btn-ghost:hover{background:#e8e8e8}
    .spinner{width:40px;height:40px;border:3px solid #f0f0f0;border-top-color:#409eff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card">
    <div class="title">扫码登录</div>
    <div class="sub">用微信扫描下方二维码</div>
    <div class="qr-wrap" id="qrWrap"><div class="spinner"></div></div>
    <div class="status s-pending" id="status">正在获取二维码...</div>
    <div class="countdown" id="countdown"></div>
    <div class="acc-box" id="accBox"></div>
    <div class="actions">
      <button class="btn btn-primary" id="refreshBtn">重新生成</button>
      <a class="btn btn-ghost" href="/">返回首页</a>
    </div>
  </div>
  <script>
    const $=id=>document.getElementById(id);
    const QR_TTL=110;
    let sid=null,pollTimer=null,cdTimer=null,secsLeft=0;
    async function api(method,url){
      const r=await fetch(url,{method});
      const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}
      const isEnv=d&&typeof d==='object'&&!Array.isArray(d)&&'code' in d&&'msg' in d&&'data' in d;
      if(!r.ok||(isEnv&&d.code!==0)){throw{status:r.status,data:isEnv?d.data:d,message:isEnv?d.msg:'HTTP '+r.status}}
      return isEnv?d.data:d
    }
    function setStatus(t,c){const s=$('status');s.textContent=t;s.className='status '+c}
    function stopTimers(){if(pollTimer)clearInterval(pollTimer);if(cdTimer)clearInterval(cdTimer);pollTimer=cdTimer=null}
    function startCountdown(){
      secsLeft=QR_TTL;$('countdown').textContent=`二维码 ${secsLeft}s 后自动刷新`;
      cdTimer=setInterval(()=>{secsLeft--;$('countdown').textContent=secsLeft>0?`二维码 ${secsLeft}s 后自动刷新`:'二维码已过期，正在刷新...';if(secsLeft<=0){stopTimers();newQr()}},1000)
    }
    async function newQr(){
      stopTimers();$('accBox').style.display='none';
      $('qrWrap').innerHTML='<div class="spinner"></div>';
      setStatus('正在获取二维码...','s-pending');$('countdown').textContent='';
      try{
        const r=await api('POST','/qr');sid=r.session_id;
        $('qrWrap').innerHTML=`<img src="${r.image_url}?t=${Date.now()}" alt="二维码">`;
        setStatus('等待扫码...','s-pending');startCountdown();
        pollTimer=setInterval(poll,1500)
      }catch(e){setStatus('获取二维码失败: '+(e.message||''),'s-err')}
    }
    async function poll(){
      if(!sid)return;let st;
      try{st=await api('GET',`/qr/${sid}/poll`)}catch{return}
      if(st.status==='pending')setStatus('等待扫码...','s-pending');
      else if(st.status==='scanned')setStatus('已扫码，请在手机上确认','s-scanned');
      else if(st.status==='authorized'||st.status==='confirmed'){stopTimers();await confirm()}
      else if(st.status==='expired'||st.status==='unknown'){stopTimers();setStatus('二维码已失效，正在重新生成...','s-err');newQr()}
      else if(st.status==='cancelled'){stopTimers();setStatus('已取消，请重新生成二维码','s-err');$('countdown').textContent=''}
    }
    async function confirm(){
      const confirmSid=sid;sid=null;  // 立即清空 sid，阻止残留 poll 请求
      $('countdown').textContent='';setStatus('授权成功，正在入库...','s-ok');
      try{
        const resp=await api('POST',`/qr/${confirmSid}/confirm`);
        const acc=resp.account||resp;
        const redirect=resp.redirect||'/my';
        setStatus('✓ 登录成功','s-ok');
        const name=resp.account?(resp.account.nickname||resp.account.openid||'账号'):(acc.nickname||acc.openid||'账号');
        $('accBox').style.display='block';
        $('accBox').innerHTML=`<div>账号：<b>${name}</b></div><div>状态：${acc.status||'alive'}</div>`;
        $('qrWrap').innerHTML='<div style="font-size:48px;color:#52c41a">✓</div>';
        // Redirect to /my after 2 seconds
        setTimeout(()=>{location.href=redirect},2000)
      }catch(e){setStatus('入库失败: '+(e.message||''),'s-err')}
    }
    $('refreshBtn').addEventListener('click',newQr);
    newQr();
  </script>
</body>
</html>
