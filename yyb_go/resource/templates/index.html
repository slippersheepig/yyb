<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YYB 管理后台</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#f0f2f5;--card:#fff;--ink:#1a1a2e;--muted:#909399;--line:#e8e8e8;--primary:#1a1a2e;--primary-h:#2d2d44;--danger:#ff4d4f;--danger-bg:#fff2f0;--success:#52c41a;--success-bg:#f6ffed;--warning:#faad14;--warning-bg:#fffbe6;--radius:10px}
    body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100vh}
    .topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
    .brand .mark{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
    .nav{display:flex;gap:16px;align-items:center}
    .nav a{color:var(--muted);text-decoration:none;font-size:14px;transition:color .2s}
    .nav a:hover{color:var(--ink)}
    .btn{padding:8px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-h)}
    .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn-outline:hover{border-color:var(--primary)}
    .btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #ffccc7}.btn-danger:hover{background:#ffe7e6}
    .btn-sm{padding:5px 10px;font-size:13px}
    .container{max-width:1200px;margin:0 auto;padding:24px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--line)}
    .stat-card .label{font-size:13px;color:var(--muted);margin-bottom:6px}
    .stat-card .value{font-size:28px;font-weight:700}
    .panel{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;margin-bottom:24px}
    .panel-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .panel-head h3{font-size:15px;font-weight:700}
    .panel-body{padding:0}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:10px 16px;font-size:13px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:#fafafa}
    td{padding:10px 16px;font-size:14px;border-bottom:1px solid var(--line)}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#fafafa}
    .avatar-sm{width:32px;height:32px;border-radius:50%;vertical-align:middle;margin-right:8px;object-fit:cover;background:#f0f0f0}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
    .badge-alive{background:var(--success-bg);color:var(--success)}
    .badge-expired{background:var(--danger-bg);color:var(--danger)}
    .badge-unknown{background:#f5f5f5;color:#8c8c8c}
    .empty{text-align:center;padding:48px 20px;color:var(--muted)}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;align-items:center;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal{background:#fff;border-radius:14px;padding:28px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
    .modal h3{font-size:17px;margin-bottom:16px}
    .modal p{font-size:14px;color:var(--muted);margin-bottom:20px}
    .modal-actions{display:flex;gap:12px;justify-content:flex-end}
    .actions-cell{display:flex;gap:6px}
    .loading{text-align:center;padding:40px;color:var(--muted)}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    @media(max-width:768px){.container{padding:16px}.topbar{padding:0 16px}.stats{grid-template-columns:1fr 1fr}table{font-size:13px}th,td{padding:8px 10px}}
    @media(max-width:480px){.stats{grid-template-columns:1fr}.container{padding:12px}.topbar{padding:0 12px}.brand{font-size:15px}.nav{gap:10px}.nav a{font-size:13px}th,td{padding:6px 8px;white-space:nowrap}.actions-cell{white-space:nowrap}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><div class="mark">Y</div>YYB 管理后台</div>
    <div class="nav">
      <a href="/scan">扫码添加</a>
      <a href="/docs/index.html">API 文档</a>
      <a href="/logout">退出</a>
    </div>
  </div>
  <div class="container">
    <div class="stats" id="stats">
      <div class="stat-card"><div class="label">账号总数</div><div class="value" id="totalCount">-</div></div>
      <div class="stat-card"><div class="label">可用</div><div class="value" id="aliveCount" style="color:var(--success)">-</div></div>
      <div class="stat-card"><div class="label">需重扫</div><div class="value" id="expiredCount" style="color:var(--danger)">-</div></div>
      <div class="stat-card"><div class="label">未知</div><div class="value" id="unknownCount" style="color:var(--muted)">-</div></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>账号列表</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline btn-sm" id="refreshBtn">刷新存活</button>
          <a class="btn btn-primary btn-sm" href="/scan">添加账号</a>
        </div>
      </div>
      <div class="panel-body">
        <div class="loading" id="tableLoading">加载中...</div>
        <div class="table-wrap">
        <table id="accountsTable" style="display:none">
          <thead><tr><th>昵称</th><th>UIN</th><th>状态</th><th>OpenID</th><th>操作</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        </div>
        <div class="empty" id="emptyState" style="display:none">暂无账号，点击"添加账号"开始扫码</div>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="delModal">
    <div class="modal">
      <h3>删除账号</h3>
      <p>确定要删除 <strong id="delName"></strong> 吗？此操作不可撤销。</p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="delCancel">取消</button>
        <button class="btn btn-danger" id="delConfirm">确认删除</button>
      </div>
    </div>
  </div>
  <script>
    let accounts=[];
    const $=id=>document.getElementById(id);
    async function loadAccounts(){
      $('tableLoading').style.display='block';
      $('accountsTable').style.display='none';
      $('emptyState').style.display='none';
      try{
        const r=await fetch('/api/admin/accounts');
        const d=await r.json();
        if(d.code!==0){$('tableLoading').textContent='加载失败: '+d.msg;return}
        accounts=d.data||[];
        renderAccounts();
      }catch(e){$('tableLoading').textContent='网络错误'}
    }
    function renderAccounts(){
      $('tableLoading').style.display='none';
      if(!accounts.length){$('emptyState').style.display='block';updateStats();return}
      $('accountsTable').style.display='table';
      const tb=$('tbody');
      tb.innerHTML=accounts.map(a=>{
        const nick=a.nickname||'(未命名)';
        const st=a.status||'unknown';
        const cls=st==='alive'?'badge-alive':st==='expired'?'badge-expired':'badge-unknown';
        const stText=st==='alive'?'✅ 可用':st==='expired'?'⚠️ 需重扫':'❓ '+st;
        return `<tr>
          <td><img class="avatar-sm" src="/accounts/avatar?ref=${encodeURIComponent(a.openid)}" alt="" onerror="this.style.display='none'">${nick}</td>
          <td>${a.uin||'-'}</td>
          <td><span class="badge ${cls}">${stText}</span></td>
          <td style="font-size:11px;color:var(--muted)">${a.openid}</td>
          <td class="actions-cell"><button class="btn btn-danger btn-sm" onclick="askDelete('${a.openid}')">删除</button></td>
        </tr>`}).join('');
      updateStats();
    }
    function updateStats(){
      const total=accounts.length;
      const alive=accounts.filter(a=>(a.status||'')==='alive').length;
      const expired=accounts.filter(a=>(a.status||'')==='expired').length;
      const unknown=total-alive-expired;
      $('totalCount').textContent=total;
      $('aliveCount').textContent=alive;
      $('expiredCount').textContent=expired;
      $('unknownCount').textContent=unknown;
    }
    let delRef=null;
    function askDelete(ref){
      const a=accounts.find(x=>x.openid===ref);
      if(!a)return;
      delRef=ref;
      $('delName').textContent=a.nickname||a.openid;
      $('delModal').classList.add('show');
    }
    $('delCancel').addEventListener('click',()=>{$('delModal').classList.remove('show');delRef=null});
    $('delConfirm').addEventListener('click',async()=>{
      if(!delRef)return;
      try{
        const r=await fetch('/api/admin/accounts/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:delRef})});
        const d=await r.json();
        if(d.code===0){$('delModal').classList.remove('show');await loadAccounts();}else{alert(d.msg||'删除失败')}
      }catch(e){alert('网络错误')}
      delRef=null;
    });
    $('refreshBtn').addEventListener('click',async()=>{
      $('refreshBtn').textContent='刷新中...';$('refreshBtn').disabled=true;
      try{const r=await fetch('/api/admin/accounts/refresh',{method:'POST'});const d=await r.json();if(d.code===0){await loadAccounts();}}catch(e){}finally{$('refreshBtn').textContent='刷新存活';$('refreshBtn').disabled=false}
    });
    loadAccounts();
  </script>
</body>
</html>
