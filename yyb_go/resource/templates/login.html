<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YYB 管理登录</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    .card{background:#fff;width:380px;max-width:calc(100% - 32px);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.06);padding:36px 32px}
    @media(max-width:480px){.card{padding:24px 20px}.logo h1{font-size:18px}.field input{padding:10px 12px;font-size:13px}.btn{font-size:14px;padding:11px}}
    .logo{text-align:center;margin-bottom:28px}
    .logo .mark{width:48px;height:48px;border-radius:10px;background:#1a1a2e;color:#fff;font-weight:800;font-size:22px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
    .logo h1{font-size:20px;font-weight:700;color:#1a1a2e}
    .logo p{font-size:13px;color:#909399;margin-top:4px}
    .field{margin-bottom:20px}
    .field label{display:block;font-size:13px;font-weight:600;color:#606266;margin-bottom:8px}
    .field input{width:100%;padding:11px 14px;border:1px solid #dcdfe6;border-radius:8px;font-size:14px;outline:none;transition:border-color .2s}
    .field input:focus{border-color:#409eff;box-shadow:0 0 0 3px rgba(64,158,255,.1)}
    .btn{width:100%;padding:12px;border:none;border-radius:8px;background:#1a1a2e;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
    .btn:hover{background:#2d2d44}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .err{color:#f56c6c;font-size:13px;text-align:center;margin-top:12px;min-height:20px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="mark">Y</div>
      <h1>YYB 管理后台</h1>
      <p>请输入管理员账号密码登录</p>
    </div>
    <form id="loginForm">
      <div class="field">
        <label>用户名</label>
        <input id="username" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="password" autocomplete="off">
      </div>
      <div class="err" id="error"></div>
      <button class="btn" type="submit" id="submitBtn">登录</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('error');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = '登录中...';
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username.value, password: password.value })
        });
        const d = await r.json();
        if (d.code === 0) {
          location.href = (d.data && d.data.redirect) || '/admin';
        } else {
          errEl.textContent = d.msg || '登录失败';
          btn.disabled = false;
          btn.textContent = '登录';
        }
      } catch(err) {
        errEl.textContent = '网络错误，请重试';
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
