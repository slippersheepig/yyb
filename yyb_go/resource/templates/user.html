<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的账号 — YYB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #303133;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .user-card {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .card-header .avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.3);
      overflow: hidden;
      background: rgba(255,255,255,0.1);
      display: grid; place-items: center;
      font-size: 24px; font-weight: 700; flex-shrink: 0;
    }
    .card-header .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .card-header .status-line { font-size: 13px; opacity: 0.85; }
    .card-body { padding: 24px 32px; }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: #909399; font-size: 13px; }
    .info-row .value { font-weight: 600; font-size: 14px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.alive { background: #f0f9eb; color: #67c23a; }
    .status-badge.expired { background: #fef0f0; color: #f56c6c; }
    .status-badge.unknown { background: #f4f4f5; color: #909399; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; }
    .status-badge.alive .status-dot { background: #67c23a; }
    .status-badge.expired .status-dot { background: #f56c6c; }
    .status-badge.unknown .status-dot { background: #909399; }
    .card-footer {
      padding: 0 32px 28px;
      text-align: center;
    }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
    }
    .btn-ghost { background: #f0f0f0; color: #606266; }
    .btn-ghost:hover { background: #e8e8e8; }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #909399;
    }
    .error-box {
      text-align: center;
      padding: 32px 20px;
      color: #f56c6c;
    }
  </style>
</head>
<body>
  <div class="user-card" id="userCard">
    <div class="loading" id="loadingBox">正在加载账号信息…</div>
  </div>

  <script>
    async function api(method, url) {
      const r = await fetch(url, { method });
      const t = await r.text();
      let d; try { d = t ? JSON.parse(t) : null; } catch { d = t; }
      const isEnv = d && typeof d === 'object' && !Array.isArray(d)
        && 'code' in d && 'msg' in d && 'data' in d;
      if (!r.ok || (isEnv && d.code !== 0)) {
        const err = new Error(isEnv ? d.msg : 'HTTP ' + r.status);
        err.data = isEnv ? d.data : d;
        throw err;
      }
      return isEnv ? d.data : d;
    }

    function escapeHTML(v) {
      return String(v ?? '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
    }

    function formatTime(ts) {
      if (!ts) return '—';
      const d = new Date(ts * 1000);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function statusBadge(status) {
      const cls = status === 'alive' ? 'alive' : status === 'expired' ? 'expired' : 'unknown';
      const text = status === 'alive' ? '可用' : status === 'expired' ? '需重扫' : '待确认';
      return `<span class="status-badge ${cls}"><span class="status-dot"></span>${text}</span>`;
    }

    async function loadMyStatus() {
      try {
        const acc = await api('GET', '/api/my/status');
        const card = $('userCard');
        const name = acc.nickname || acc.alias || '微信用户';
        card.innerHTML = `
          <div class="card-header">
            <div class="avatar">
              <img src="/accounts/avatar?ref=${encodeURIComponent(acc.openid)}" onerror="this.style.display='none';this.parentElement.textContent='${escapeHTML(name.slice(0,1))}'">
            </div>
            <div>
              <h1>${escapeHTML(name)}</h1>
              <div class="status-line">${statusBadge(acc.status)}</div>
            </div>
          </div>
          <div class="card-body">
            <div class="info-row">
              <span class="label">OpenID</span>
              <span class="value" style="font-size:12px;font-family:monospace">${escapeHTML(acc.openid)}</span>
            </div>
            <div class="info-row">
              <span class="label">UIN</span>
              <span class="value">${escapeHTML(acc.uin ?? '—')}</span>
            </div>
            <div class="info-row">
              <span class="label">账号状态</span>
              <span>${statusBadge(acc.status)}</span>
            </div>
            <div class="info-row">
              <span class="label">最后检查</span>
              <span class="value">${formatTime(acc.last_checked_at)}</span>
            </div>
            <div class="info-row">
              <span class="label">创建时间</span>
              <span class="value">${formatTime(acc.created_at)}</span>
            </div>
          </div>
          <div class="card-footer">
            <a class="btn btn-ghost" href="/scan">重新扫码</a>
          </div>
        `;
      } catch (e) {
        $('userCard').innerHTML = `
          <div class="error-box">
            <p style="font-size:16px;margin-bottom:12px">无法获取账号信息</p>
            <p style="font-size:13px;color:#909399;margin-bottom:20px">${escapeHTML(e.message || '请重新扫码登录')}</p>
            <a class="btn btn-ghost" href="/scan">扫码登录</a>
          </div>
        `;
      }
    }

    function $(id) { return document.getElementById(id); }
    loadMyStatus();
  </script>
</body>
</html>
