<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的账号 — YYB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #303133;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .user-card {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .card-header .avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.3);
      overflow: hidden;
      background: rgba(255,255,255,0.1);
      display: grid; place-items: center;
      font-size: 24px; font-weight: 700; flex-shrink: 0;
    }
    .card-header .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .card-header .status-line { font-size: 13px; opacity: 0.85; }
    .card-body { padding: 24px 32px; }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: #909399; font-size: 13px; }
    .info-row .value { font-weight: 600; font-size: 14px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.alive { background: #f0f9eb; color: #67c23a; }
    .status-badge.expired { background: #fef0f0; color: #f56c6c; }
    .status-badge.unknown { background: #f4f4f5; color: #909399; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; }
    .status-badge.alive .status-dot { background: #67c23a; }
    .status-badge.expired .status-dot { background: #f56c6c; }
    .status-badge.unknown .status-dot { background: #909399; }
    .card-footer {
      padding: 0 32px 28px;
      text-align: center;
    }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
    }
    .btn-ghost { background: #f0f0f0; color: #606266; }
    .btn-ghost:hover { background: #e8e8e8; }
    .btn-jd {
      background: linear-gradient(135deg, #e1251b 0%, #cf0a2c 100%);
      color: #fff;
      width: 100%;
      margin-bottom: 12px;
    }
    .btn-jd:hover { opacity: 0.9; }
    .btn-jd:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-copy-ck {
      background: linear-gradient(135deg, #1aad19 0%, #0e8c0e 100%);
      color: #fff;
      width: 100%;
      margin-bottom: 12px;
      display: none;
    }
    .btn-copy-ck:hover { opacity: 0.9; }
    .btn-copy-ck:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #909399;
    }
    .error-box {
      text-align: center;
      padding: 32px 20px;
      color: #f56c6c;
    }
    /* JD check result box */
    .jd-result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    .jd-result.ok { background: #f0f9eb; border: 1px solid #c2e7b0; color: #67c23a; }
    .jd-result.risk { background: #fdf6ec; border: 1px solid #f5dab1; color: #e6a23c; }
    .jd-result.error { background: #fef0f0; border: 1px solid #fbc4c4; color: #f56c6c; }
    .jd-result .jd-title { font-weight: 700; margin-bottom: 8px; white-space: pre-line; }
    .jd-result .jd-link {
      display: block;
      margin-top: 10px;
      word-break: break-all;
      color: #409eff;
      text-decoration: none;
      font-size: 12px;
      font-family: monospace;
    }
    .jd-result .jd-link:hover { text-decoration: underline; }
    .jd-spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #ddd;
      border-top-color: #e1251b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1aad19;
      color: #fff;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      z-index: 9999;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.error { background: #f56c6c; }
  </style>
</head>
<body>
  <div class="user-card" id="userCard">
    <div class="loading" id="loadingBox">正在加载账号信息…</div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // ── 当前验证产生的京东CK（仅内存，不持久化到前端存储）──
    let _jdCk = '';

    function $(id) { return document.getElementById(id); }

    function escapeHTML(v) {
      return String(v ?? '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
    }

    function formatTime(ts) {
      if (!ts) return '—';
      const d = new Date(ts * 1000);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function statusBadge(status) {
      const cls = status === 'alive' ? 'alive' : status === 'expired' ? 'expired' : 'unknown';
      const text = status === 'alive' ? '可用' : status === 'expired' ? '需重扫' : '待确认';
      return `<span class="status-badge ${cls}"><span class="status-dot"></span>${text}</span>`;
    }

    function showToast(msg, isError) {
      const t = $('toast');
      if (!t) return;
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { t.className = 'toast' + (isError ? ' error' : ''); }, 2000);
    }

    async function api(method, url, body) {
      const opts = { method };
      if (body) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
      }
      const r = await fetch(url, opts);
      const t = await r.text();
      let d; try { d = t ? JSON.parse(t) : null; } catch { d = t; }
      const isEnv = d && typeof d === 'object' && !Array.isArray(d)
        && 'code' in d && 'msg' in d && 'data' in d;
      if (!r.ok || (isEnv && d.code !== 0)) {
        const err = new Error(isEnv ? d.msg : 'HTTP ' + r.status);
        err.data = isEnv ? d.data : d;
        throw err;
      }
      return isEnv ? d.data : d;
    }

    // ── 处理结果展示 ──
    function displayJdResult(resp, btnId, defaultBtnText) {
      const result = $('jdResult');
      if (resp.status === 'ok') {
        result.className = 'jd-result ok';
        result.style.display = 'block';
        result.innerHTML = `<div class="jd-title">✅ ${escapeHTML(resp.message || '操作成功')}</div>` +
          (resp.pt_pin ? `<div>账号：${escapeHTML(resp.pt_pin)}</div>` : '');
        if (resp.jd_cookie) {
          _jdCk = resp.jd_cookie;
          const copyBtn = $('copyCkBtn');
          if (copyBtn) copyBtn.style.display = 'inline-block';
        }
      } else if (resp.status === 'risk') {
        result.className = 'jd-result risk';
        result.style.display = 'block';
        const expireNote = resp.risk_expire_at
          ? `（链接将在 ${new Date(resp.risk_expire_at * 1000).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})} 失效）`
          : '（链接 30 分钟内有效）';
        result.innerHTML = `<div class="jd-title">⚠️ ${escapeHTML(resp.message || '需要风险认证')}</div>` +
          `<div>请点击下方链接在新窗口中完成认证，完成后回到本页点击「重新验证」${escapeHTML(expireNote)}</div>` +
          `<a class="jd-link" href="${escapeHTML(resp.risk_url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(resp.risk_url)}</a>`;
      } else {
        result.className = 'jd-result error';
        result.style.display = 'block';
        result.innerHTML = `<div class="jd-title">❌ ${escapeHTML(resp.message || '操作失败')}</div>`;
      }
      const btn = $(btnId);
      if (btn) {
        btn.disabled = false;
        btn.textContent = defaultBtnText;
      }
    }

    function displayJdError(e, btnId, defaultBtnText) {
      const result = $('jdResult');
      result.className = 'jd-result error';
      result.style.display = 'block';
      result.innerHTML = `<div class="jd-title">❌ 请求失败</div><div>${escapeHTML(e.message || '未知错误')}</div>`;
      const btn = $(btnId);
      if (btn) {
        btn.disabled = false;
        btn.textContent = defaultBtnText;
      }
    }

    // ── 京东验证 (Original Code path) ──
    let jdChecking = false;

    async function runJdCheck() {
      if (jdChecking) return;
      jdChecking = true;
      const btn = $('jdBtn');
      const result = $('jdResult');
      btn.disabled = true;
      btn.innerHTML = '<span class="jd-spinner"></span>正在验证...';
      result.style.display = 'none';
      try {
        const resp = await api('POST', '/api/my/jd-check');
        displayJdResult(resp, 'jdBtn', '📱 原始验证 (Code登录)');
      } catch (e) {
        displayJdError(e, 'jdBtn', '📱 原始验证 (Code登录)');
      } finally {
        jdChecking = false;
      }
    }

    // ── WSKEY 转换验证 ──
    async function runWskeyExchange() {
      if (jdChecking) return;
      jdChecking = true;
      const btn = $('jdWskeyBtn');
      const result = $('jdResult');
      btn.disabled = true;
      btn.innerHTML = '<span class="jd-spinner"></span>正在转换...';
      result.style.display = 'none';
      try {
        const resp = await api('POST', '/api/my/jd-wskey/exchange');
        displayJdResult(resp, 'jdWskeyBtn', '🔑 WSKEY 转换验证 (推荐)');
        setTimeout(loadMyStatus, 1000); // Reload status to update UI
      } catch (e) {
        displayJdError(e, 'jdWskeyBtn', '🔑 WSKEY 转换验证 (推荐)');
      } finally {
        jdChecking = false;
      }
    }

    // ── 录入 WSKEY（京东 APP 抓包获取）──
    async function importWskey() {
      const input = $('wskeyInput');
      const btn = $('wskeyImportBtn');
      const wskey = ((input && input.value) || '').trim();
      if (!wskey) { showToast('请先粘贴 WSKEY', true); return; }
      if (wskey.indexOf('AAJ') === -1) { showToast('凭证里没有 AAJ…，请确认为京东APP抓包的 pin=…;wskey=AAJ…', true); return; }
      if (btn) { btn.disabled = true; btn.textContent = '录入中…'; }
      try {
        const resp = await api('POST', '/api/my/jd-wskey/import', { wskey });
        if (resp && resp.verified) {
          showToast(resp.message || ('✅ 录入成功并验活（pin=' + (resp.pt_pin || '') + '）'));
        } else {
          showToast(resp && resp.message ? resp.message : '✅ 已保存，但未验活成功（wskey 可能已失效）', true);
        }
        if (input) input.value = '';
        setTimeout(loadMyStatus, 800);
      } catch (e) {
        showToast('❌ 录入失败: ' + (e.message || '未知错误'), true);
        if (btn) { btn.disabled = false; btn.textContent = '📥 录入'; }
      }
    }

    // ── 验证已录入的 WSKEY（拿不到有效 cookie 就明确报失败）──
    async function verifyWskey() {
      const btn = $('wskeyVerifyBtn');
      if (btn) { btn.disabled = true; btn.textContent = '验证中…'; }
      try {
        const resp = await api('POST', '/api/my/jd-wskey/verify');
        const ok = !!(resp && resp.ok);
        showToast((resp && resp.message) ? resp.message : (ok ? '✅ 验证成功' : '❌ 验证失败：拿不到有效 cookie'), !ok);
        setTimeout(loadMyStatus, 800);
      } catch (e) {
        showToast('❌ 验证失败: ' + (e.message || '未知错误'), true);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '✅ 验证'; }
      }
    }

    // ── 刷新 WSKEY ──
    async function runWskeyRefresh() {
      if (jdChecking) return;
      jdChecking = true;
      const btn = $('wskeyRefreshBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="jd-spinner"></span>获取中...';
      try {
        const resp = await api('POST', '/api/my/jd-wskey/refresh');
        showToast('✅ WSKEY 刷新成功');
        setTimeout(loadMyStatus, 500); // Reload status
      } catch (e) {
        showToast('❌ WSKEY 刷新失败: ' + (e.message || '未知错误'), true);
        btn.disabled = false;
        btn.textContent = '🔄 从微信刷新获取 WSKEY';
      } finally {
        jdChecking = false;
      }
    }

    // ── 复制京东CK ──
    async function copyJdCk() {
      if (!_jdCk) {
        showToast('请先点击「验证」', true);
        return;
      }
      try {
        await navigator.clipboard.writeText(_jdCk);
        showToast('✅ 京东CK已复制到剪贴板');
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = _jdCk;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('✅ 京东CK已复制到剪贴板');
        } catch (e2) {
          showToast('复制失败，请手动复制', true);
        }
        document.body.removeChild(ta);
      }
    }

    // ── 加载账号信息 ──
    async function loadMyStatus() {
      try {
        const resp = await api('GET', '/api/my/status');
        if (resp.is_admin && !resp.account) { location.href = '/admin'; return; }
        const acc = resp.account || resp;
        const card = $('userCard');
        const name = acc.nickname || acc.alias || '微信用户';

        let riskBanner = '';
        if (acc.jd_risk_url) {
          const now = Math.floor(Date.now() / 1000);
          const expired = acc.jd_risk_expire_at && acc.jd_risk_expire_at <= now;
          if (!expired) {
            const expireStr = acc.jd_risk_expire_at
              ? `（链接将在 ${new Date(acc.jd_risk_expire_at * 1000).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})} 失效）`
              : '';
            riskBanner = `
            <div class="jd-result risk" id="jdResult" style="display:block">
              <div class="jd-title">⚠️ 上次验证需要风险认证</div>
              <div>请点击下方链接在新窗口中完成认证，完成后回到本页点击「重新验证」${escapeHTML(expireStr)}</div>
              <a class="jd-link" href="${escapeHTML(acc.jd_risk_url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(acc.jd_risk_url)}</a>
            </div>`;
          } else {
            riskBanner = `<div class="jd-result" id="jdResult"></div>`;
          }
        } else {
          riskBanner = `<div class="jd-result" id="jdResult"></div>`;
        }

        // Fetch WSKEY Status
        let wskeyResp = { has_wskey: false, has_cookie: false };
        try {
          wskeyResp = await api('GET', '/api/my/jd-wskey/status');
        } catch (err) {
          console.warn("Failed to get wskey status", err);
        }

        let wskeyHtml = '';
        if (wskeyResp) {
           wskeyHtml = `
          <div style="padding:16px 32px;border-top:1px solid #ebeef5;background:#fafbfc">
            <div style="font-size:15px;font-weight:600;margin-bottom:12px;color:#303133">🔑 WSKEY 状态</div>
            <div style="font-size:13px;color:#606266;margin-bottom:12px;line-height:1.6">
              状态: <span style="font-weight:600;color:${wskeyResp.has_wskey ? '#67c23a' : '#909399'}">${wskeyResp.has_wskey ? '✅ 已获取' : '❌ 未获取'}</span>
              ${wskeyResp.has_wskey ? `<br>预览: <span style="font-family:monospace;font-size:12px;background:#eee;padding:2px 4px;border-radius:4px">${escapeHTML(wskeyResp.wskey_preview || '***')}</span>` : ''}
              ${wskeyResp.has_cookie ? `<br>有效转换: <span style="color:#67c23a">✅ 是</span> (pin=${escapeHTML(wskeyResp.pt_pin || '')})` : ''}
            </div>
            <div style="display:flex;gap:8px">
              <input id="wskeyInput" type="text" placeholder="粘贴京东APP抓包的凭证：pin=你的pin;wskey=AAJ…" style="flex:1;min-width:0;padding:8px 10px;font-size:12px;border:1px solid #dcdfe6;border-radius:6px;font-family:monospace" />
              <button class="btn btn-ghost" style="padding:8px 14px;font-size:13px;white-space:nowrap" onclick="importWskey()" id="wskeyImportBtn">📥 录入</button>
              <button class="btn btn-ghost" style="padding:8px 14px;font-size:13px;white-space:nowrap" onclick="verifyWskey()" id="wskeyVerifyBtn">✅ 验证</button>
            </div>
            <div style="font-size:12px;color:#909399;margin-top:8px;line-height:1.5">
              ⚠️ 微信扫码侧无法获取 wskey（京东APP 的 wskey 不写进小程序 storage）。请用京东 APP 抓包（VNET / Stream）取到形如 <code>pin=你的pin;wskey=AAJ…</code> 后粘此，录入即自动验活并生成 30 天 app_open cookie。
            </div>
          </div>
          `;
        }

        card.innerHTML = `
          <div class="card-header">
            <div class="avatar">
              <img src="/api/my/avatar" onerror="this.style.display='none';this.parentElement.textContent='${escapeHTML(name.slice(0,1))}'">
            </div>
            <div>
              <h1>${escapeHTML(name)}</h1>
              <div class="status-line">${statusBadge(acc.status)}</div>
            </div>
          </div>
          <div class="card-body">
            <div class="info-row">
              <span class="label">OpenID</span>
              <span class="value" style="font-size:12px;font-family:monospace">${escapeHTML(acc.openid)}</span>
            </div>
            <div class="info-row">
              <span class="label">UIN</span>
              <span class="value">${escapeHTML(acc.uin ?? '—')}</span>
            </div>
            <div class="info-row">
              <span class="label">账号状态</span>
              <span>${statusBadge(acc.status)}</span>
            </div>
            <div class="info-row">
              <span class="label">最后检查</span>
              <span class="value">${formatTime(acc.last_checked_at)}</span>
            </div>
            <div class="info-row">
              <span class="label">创建时间</span>
              <span class="value">${formatTime(acc.created_at)}</span>
            </div>
            ${riskBanner}
          </div>
          ${wskeyHtml}
          <div class="card-footer" style="padding-top:24px">
            <button class="btn btn-jd" id="jdWskeyBtn" onclick="runWskeyExchange()">🔑 WSKEY 转换验证 (推荐)</button>
            <button class="btn btn-ghost" id="jdBtn" onclick="runJdCheck()" style="width:100%;margin-bottom:12px">📱 原始验证 (Code登录)</button>
            <button class="btn btn-copy-ck" id="copyCkBtn" onclick="copyJdCk()" style="display:none;width:100%;margin-bottom:12px">📋 复制京东CK</button>
            <a class="btn btn-ghost" href="/scan" style="width:100%">重新扫码</a>
            ${resp.is_admin ? '<a class="btn btn-ghost" href="/admin" style="width:100%;margin-top:12px">管理后台</a>' : ''}
          </div>
          <div id="wxBindSection" style="padding:20px 32px;border-top:1px solid #ebeef5">
            <div style="font-size:15px;font-weight:600;margin-bottom:12px;color:#303133">📱 微信通知绑定</div>
            <div id="wxBindContent" style="font-size:13px;color:#606266">加载中…</div>
          </div>
        `;
      } catch (e) {
        $('userCard').innerHTML = `
          <div class="error-box">
            <p style="font-size:16px;margin-bottom:12px">无法获取账号信息</p>
            <p style="font-size:13px;color:#909399;margin-bottom:20px">${escapeHTML(e.message || '请重新扫码登录')}</p>
            <a class="btn btn-ghost" href="/scan">扫码登录</a>
          </div>
        `;
      }
    }

    loadMyStatus();

    // ── 微信通知绑定 ──
    async function loadWxBindStatus() {
      try {
        const resp = await api('POST', '/api/wx/bind-status');
        const el = $('wxBindContent');
        if (!el) return;
        if (resp.bound) {
          el.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px">
              <span style="color:#67c23a;font-size:16px">✅</span>
              <span>已绑定微信公众号「${escapeHTML(resp.gzh_name || '3DS电影')}」</span>
            </div>
            <div style="margin-top:8px;color:#909399;font-size:12px">在公众号发送「yyb 取件」可获取登录状态和京东验证结果通知</div>
          `;
        } else {
          el.innerHTML = `
            <div style="margin-bottom:12px;color:#606266">绑定后可在公众号接收登录状态和京东验证结果通知</div>
            <div id="wxBindCodeArea" style="margin-bottom:16px"></div>
            <div id="wxQrArea" style="text-align:center"></div>
            <button class="btn btn-ghost" id="wxGenBtn" onclick="genBindCode()" style="margin-top:12px;width:100%">生成绑定码</button>
          `;
          showBindCode(resp.bind_code || '', resp.gzh_link, resp.gzh_name);
        }
      } catch (e) {
        const el = $('wxBindContent');
        if (el) el.innerHTML = '<span style="color:#909399">绑定信息加载失败</span>';
      }
    }

    async function genBindCode() {
      const btn = $('wxGenBtn');
      if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
      try {
        const resp = await api('POST', '/api/wx/bind-code');
        showBindCode(resp.bind_code, resp.gzh_link, resp.gzh_name);
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = '生成绑定码'; }
        alert('生成失败：' + (e.message || '未知错误'));
      }
    }

    function showBindCode(code, gzhLink, gzhName) {
      const codeArea = $('wxBindCodeArea');
      const qrArea = $('wxQrArea');
      const btn = $('wxGenBtn');
      if (btn) { btn.disabled = false; btn.textContent = '重新生成绑定码'; }
      const gzhDisplayName = gzhName || '3DS电影';
      if (codeArea && code) {
        codeArea.innerHTML = `
          <div style="font-size:12px;color:#909399;margin-bottom:6px">您的绑定码：</div>
          <div style="font-size:28px;font-weight:700;letter-spacing:6px;color:#409eff;text-align:center;padding:8px 0">${escapeHTML(code)}</div>
          <div style="font-size:12px;color:#909399;text-align:center">在公众号发送「yyb 绑定 ${escapeHTML(code)}」完成绑定</div>
        `;
      }
      if (qrArea && gzhLink) {
        qrArea.innerHTML = `
          <div style="font-size:12px;color:#909399;margin-bottom:8px" id="wxQrLabel">扫码关注公众号「${escapeHTML(gzhDisplayName)}」</div>
          <img src="${escapeHTML(gzhLink)}" alt="公众号二维码" style="max-width:160px;border-radius:8px;border:1px solid #ebeef5" onerror="this.style.display='none';document.getElementById('wxQrLabel').innerHTML='公众号「${escapeHTML(gzhDisplayName)}」二维码加载失败，请检查静态资源路径'">
        `;
      } else if (qrArea) {
        qrArea.innerHTML = `<div style="font-size:12px;color:#909399">公众号「${escapeHTML(gzhDisplayName)}」二维码未配置</div>`;
      }
    }

    setTimeout(loadWxBindStatus, 500);
  </script>
</body>
</html>
